<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sipariş & Gelir Kokpit Dashboard</title>
    <style>
        :root {
            /*Bütün tasarımın ortak ayarlarını tek bir yere koyuyoruz.*/
            --bg: #f8f7f4;
            --card: #ffffff;
            --border: #e6e5df;
            --text: #181716;
            --muted: #6b6963;
            --clay: #c85a32;
            --clay-hover: #b04e29;
            --font-main: "Plus Jakarta Sans", system-ui, sans-serif;
            --font-mono: "JetBrains Mono", monospace;
        }

        * {
            /* *= Sayfadaki bütün elemanlarını seçer. Burada bütün elemanlara aşağıdaki ayarları uyguları.*/
            box-sizing: border-box;
            /* width ve height hesabının içine padding ve border da dahil olsun */
            margin: 0;
            /*tarayıcının kendi verdiği dış boşlukları siliyoruz*/
            padding: 0;
            /*iç boşlukları da sıfırıyoruz*/
        }

        body {
            /*sayfanın tamamını temsil eder body.*/
            background: var(--bg);
            /*sayfanın arka plan rengi root içine yazdığımız değişkenden alır.*/
            color: var(--text);
            /*sayfanın yazı rengi*/
            font-family: var(--font-main);
            /*sayfanın yazı tipi*/
            padding: 36px 16px;
            /*sayfanın içeriği ekranın dibine yapışmasın diye iç boşluk*/
            line-height: 1.5;
            /*yazılar birbirine yapışık durmasın diye satırlar arasındaki dikey mesafe*/
        }

        .kokpit {
            /* . ile class seçtiğimizi gösteririz. html içindeki kokpit classını seçiyoruz */
            max-width: 960px;
            /*kokpitin max genişliği.*/
            margin: 0 auto;
            /* auto sayesinde yatayda ortalanır yani 960px lik alanı ekranın ortasına koy.*/
        }

        /* Header & KPI */
        .header {
            margin-bottom: 24px;
            /* headerin altına 24px boşluk bırak altındaki şey yapışık durmasın */
            padding-bottom: 16px;
            /*elementin içindeki boşluk*/
            border-bottom: 1px solid var(--border);
            /* headerin altına ince çizgi. 1px: çizginin kalınlığı. solid: düz çizgi. */
        }

        .header__tag {
            /*headerin tag bölümü*/
            font-size: 11px;
            /*yazı boyutu*/
            text-transform: uppercase;
            /*yazılan harfleri büyük harflere dönüştür.*/
            letter-spacing: 0.12em;
            /*harfler arasındaki mesafeyi açar*/
            color: var(--clay);
            font-weight: 700;
            /*yazıyı kalınlaştırıyorz*/
        }

        .header__title {
            font-size: 26px;
            font-weight: 700;
            margin-top: 2px;
            /*başlığın üst kısmına 2px boşluk*/
        }

        .kpi-grid {
            display: grid;
            /* bu alanı css grid yapıyorz bu sayede elemanları satır/sütun
            şeklinde düzenleyebilcez yani kutucuklar halinde.*/
            grid-template-columns: repeat(3, 1fr);
            /*burada 3 tane SÜTUN oluştur ve alanı bunlara
            paylaştır diyorz. repeat(3..) : 3 kere tekrar et. 1fr: kullanılabilir alan payı 1*/
            gap: 14px;
            /*grid içindeki kartlar arasına 14px boşluk*/
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            /*kartın köşelerini yuvarlaklaştırır*/
            padding: 14px 18px;
            /*kartın iç boşluğu. üst alt: 14 | sağ sol:18*/
        }

        .kpi-card span {
            /*kpi-card içindeki tüm span elemenleri*/
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }

        .kpi-card h3 {
            font-size: 22px;
            font-weight: 700;
            font-family: var(--font-mono);
            margin-top: 4px;
        }

        /* Layout */
        .layout {
            /*ana içerik yerleşimi*/
            display: grid;
            grid-template-columns: 320px 1fr;
            /*burada 2 sütun olşturur ilki 320px diğeri de kalan alan*/
            gap: 24px;
        }

        @media (max-width: 768px) {

            /*ekran boyutuna göre farklı css uygulamamızı sağlar*/
            /*ekran genişliği 768px veya daha büyükse bu css çalışsın*/
            .layout,
            /*iki elementi aynıa anda seçiyorz*/
            .kpi-grid {
                grid-template-columns: 1fr;
                /*küçük ekranda artık tek sütun yapıyorz*/
                /*yani ekran daraldığında ve sığmadığında alt alta diz*/
            }
        }

        /* Form & Panel */
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .panel h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            /*label tek başına bir satırda dursun*/
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 8px 10px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .field input:focus,
        /*kullanıcı inputun içine tıkladığında/input aktif oldğnda*/
        .field select:focus {
            outline: none;
            /*tarayıcının input seçildiğinde koydğu varsyln dış çizgiyi kaldryrz.*/
            border-color: var(--clay);
            background: #fff;
        }

        .btn-submit {
            width: 100%;
            /*bulunduğu alanın tamamını kaplasın*/
            background: var(--clay);
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            /*mouse butonun üzerine gelince el işaretine dönüşsün*/
            margin-top: 6px;
        }

        .btn-submit:hover {
            /*mouse elementin üzerine gelince..*/
            background: var(--clay-hover);
            /*butonun rengi değşsin*/
        }

        /* Liste & Filtre */
        .filter-bar {
            display: flex;
            /*filtre kutularını yan yana diz*/
            gap: 10px;
            /*filteler arası 10px boşluk*/
            margin-bottom: 14px;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            /*siparişler yan yana değil alt alta gelsin*/
            gap: 10px;
        }

        .order-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            /*içerideki elemanları iki uca dağıtıyorz*/
            align-items: center;
            /*sağdaki ve soldaki içerikler dikeyde aynı hizada olsun*/
        }

        .order-item h5 {
            font-size: 13px;
            font-weight: 600;
        }

        .order-item p {
            font-size: 12px;
            color: var(--muted);
        }

        .meta-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
            background: #fef3c7;
            color: #92400e;
            font-family: var(--font-mono);
        }

        .badge--mobilya {
            background: #e0e7ff;
            color: #3730a3;
        }

        .badge--aydinlatma {
            background: #fef3c7;
            color: #b45309;
        }

        .badge--seramik {
            background: #d1fae5;
            color: #065f46;
        }

        .btn-del {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-del:hover {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="kokpit">
        <!--div: kutu. bu kutuya kokpit adını verdik. bütün dashboardı da bu ana kutunun içine koydk.-->
        <header class="header"> <!--sayfanın üst bölümünü belirtir-->
            <span class="header__tag"> Sipariş Takip </span> <!--span: küçük metin parçasını seçmek için kullanılır.-->
            <h1 class="header__title">Sipariş Yönetim Kokpiti</h1>
        </header>
        <section class="kpi-grid"> <!--sayfadaki belirli bir bölümü gruplamak için kullanılır-->
            <div class="kpi-card">
                <span>Kayıtlı Sipariş</span>
                <h3 id="kpiCount">0</h3>
            </div>
            <div class="kpi-card">
                <span>Toplam Sipariş Tutarı: </span>
                <h3 id="kpiTotal">0 ₺</h3>
            </div>
            <div class="kpi-card">
                <span>Ortalama Ürün Fiyatı</span>
                <h3 id="kpiAvg">0 ₺</h3>
            </div>
        </section>
        <main class="layout">
            <section class="panel">
                <h4>Yeni Sipariş Kaydı</h4>
                <form id="orderForm"> <!--kullanıcının bilgi girdiği alan-->
                    <div class="field">
                        <label for="prodName">Ürün Adı: </label>
                        <input type="text" id="prodName" placeholder="Sehpa" required />
                    </div>
                    <div class="field">
                        <label for="prodCat">Kategori</label>
                        <select name="prodCat" id="prodCat">
                            <option value="Mobilya">Mobilya</option>
                            <option value="Aydınlatma">Aydınlatma</option>
                            <option value="Mutfak">Mutfak</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="prodPrice">Fiyat</label>
                        <input type="number" id="prodPrice" value="3250" min="100" step="50" required />
                    </div>
                    <button type="submit" class="btn-submit">Siparişi Kaydet</button>
                </form>
            </section>
            <section class="panel">
                <div class="filter-bar"> <!--bu kısımda da ürün arama ve filtreleme bölümü olcak-->
                    <input type="text" id="searchInput" class="field" style="margin-bottom: 0"
                        placeholder="Ürün Adına Göre Filtrele" />
                    <select id="categoryFilter" style="width: 130px; font-size: 12px; padding: 6px">
                        <option value="ALL">Tüm Kategoriler</option>
                        <option value="Mobilya">Mobilya</option>
                        <option value="Aydınlatma">Aydınlatma</option>
                        <option value="Mutfak">Mutfak</option>
                    </select>
                </div>
                <div id="orderContainer" class="order-list">
                    <!--Dinamik olarak elemanlar buraya basılacak/eklenecek-->
                </div>
            </section>
        </main>
        <script> //java script başlıyor
            let orders = [ //değeri sonradan değişebilecek değşkenler için let kullanıyorz
                //burada let kullandık çünkü ilerde sipariş eklencek silincek yani orders değşcek.
                { id: 1, name: "Sehpa", category: "Mobilya", price: 6500 },
                { id: 2, name: "Abajür", category: "Aydınlatma", price: 7500 },
                { id: 3, name: "Koltuk", category: "Mobilya", price: 8500 },
                { id: 4, name: "Bulaşık Makinası", category: "Mutfak", price: 10000 },
                { id: 5, name: "Ocak", category: "Mutfak", price: 15000 },
            ];
            //dom elementleri toplayalım
            //const: değişkenin kendisini sonradan başka birşeye çevirmicez.
            const orderContainer = document.getElementById("orderContainer"); //değişkenin içine htmldeki orderContainer elementini koyıyoruz.
            //document: bütün html sayfasını temsil eder.
            //.getElementById('...') : htmlde idsi ... olan elementi bul.
            const orderForm = document.getElementById("orderForm");
            const searchInput = document.getElementById("searchInput");
            const categoryFilter = document.getElementById("categoryFilter");
            const kpiCount = document.getElementById("kpiCount");
            const kpiTotal = document.getElementById("kpiTotal");
            const kpiAvg = document.getElementById("kpiAvg");
            const updateKPIs = (dataList) => { //kpı ları güncelleyen bir fonksiyon 
                //dataList: fonksiyonun dışarıdan alacağı veri
                kpiCount.textContent = dataList.length;
                //htmldeki kpiCount elementi içindeki yazıyı değiştir dizinin eleman sayısı ile.
                //yani listede kaç ürün varsa kayutlı sipariş kartına onu yazar.

                if (dataList.length === 0) { //liste gerçekten boşsa toplamı ve ortalamayı sıfırla
                    kpiTotal.textContent = "0 ₺";
                    kpiAvg.textContent = "0 ₺";
                    return;
                }
                const total = dataList.reduce((acc, curr) => acc + curr.price, 0); //listedeki bütün price değerini toplar.
                //reduce: listedeki elemanları kullanıp tek bir sonuç üretir.
                //acc: biriken toplam. curr: şuan baktığmz eleman. Şuana kadar biriktirdim paraya bu sipariişn fiyatını da ekle.
                //0: başlangıç değeri. toplamaya sıfırdan başlar.
                kpiTotal.textContent = `${total.toLocaleString("tr-TR")} ₺`;//toplamı ekrana yaz
                //toLocaleString: sayıyı türkçe sayı biçiminde gösterir.

                const avg = total / dataList.length; //ortalamayı hesaplar.
                kpiAvg.textContent = `${Math.round(avg).toLocaleString("tr-TR")} ₺`;
                //ortalama küsuratlı çıkarsa en yakın tam sayıya yuvarla türkçeye çevir.
            };

            //filtreleme bölümü (dinamik dom/ render motoru)
            const renderOrders = () => {
                const term = searchInput.value.toLowerCase().trim(); //kullanıcının arama kutusuna ne yazdığını alırız
                //searchinput.value: arama kutusundaki yazıyı al.
                //trim: başındaki ve sonundaki gerksiz boşlukları sil.
                const selectedCat = categoryFilter.value; //kategoryde ne seçildiyse onu al

                //filtreleme bölümü
                const filtered = orders.filter((order) => { //şartı sağlayanları al sağlamayanları çıkar.
                    const matchesName = order.name.toLowerCase().includes(term); //ürün adı kullancının aradığı kelimeyi içeriyor mu
                    //includes: içinde var mı?
                    const matchesCategory =
                        selectedCat === "ALL" || order.category === selectedCat;
                    //kullanıcı bütün kategorileri seçtiyse bütün ürünleri göster
                    //veya siparişin kategorisi seçilen kategoriyle aynı mı
                    return matchesName && matchesCategory; //ikisi de doğruya döner
                });

                orderContainer.innerHTML = ""; //sipariş kutusunun içini tamamen boşalt

                if (filtered.length === 0) { //filtrelenmiş listede hiç ürün yoksa
                    //orderContainer içine html koyuyorz
                    orderContainer.innerHTML = ` 
                    <div style="padding:24px; text-align:center; color:var(--muted); font-size:12px">
                        Kriterlere Uygun Ürün Bulunamadı
                    </div>`; //uyarı divi
                    updateKPIs([]); //boş liste gönderir.
                    return;
                }

                //dinamik element üretim

                filtered.forEach((order) => {
                    //foreach kullandık çünkü listedeki her ürün için aynı işlemi yapsın diye.
                    const item = document.createElement("article"); //js ile yeni bir html elementi olşturuyorz
                    item.className = "order-item";
                    item.setAttribute("data-id", order.id); //bu html kartı hangi siparişe ait, bunu kartın üzerinde sakla.
                    const badgeClass = //kategoriye göre hangi classın kullanılacağını beliliyoruz.
                        order.category === "Mobilya"
                            ? "badge--mobilya"
                            : order.category === "Aydınlatma"
                                ? "badge--aydinlatma"
                                : "badge--seramik";

                    item.innerHTML = ` 
                        <div>
                        <h5>${order.name}</h5>
                        <p>Birim Fiyat: ${order.price.toLocaleString("tr-TR")} ₺</p>
                        </div>
                        <div class="meta-box">
                        <span class="badge ${badgeClass}">${order.category}</span>
                        <button class="btn-del"
                        data-action="delete">Sil</button>
                        </div>
                        `; //sipariş kartı oluşturyorz.
                    orderContainer.appendChild(item); //sipariş kartını ekrana koy
                });
                updateKPIs(filtered); //filtrelenmiş list.eyi KPI fonksiyonuna gönderiyorz.
                //bu sayede kullanıcı mobilya seçerse KPI lar sadece mobilya ürünlerine göre değişitor.
            };

            orderContainer.addEventListener("click", (e) => { //ordercontainer içinde biryere tıklanırsa
                //addEventListener: bir olayı dinler (click)
                //e: gerçekleşen olayın bilgisi.
                if (e.target.dataset.action === "delete") { //sil butonuna mı tıkladı?
                    //e.target: kullanıcının tam olrk tıkladğı element.
                    //dataset.action: o elementteki değer.
                    const id = Number(e.target.closest("article").dataset.id); //tıkladığım sil butonunun bulunudğu sipariş kartının ıdsini buk
                    //tıklanan butondan yukarı en yakıb article bulunur.

                    orders = orders.filter(order => order.id !== id);
                    //filter ile yeni dizi.
                    //!== : idsi silmek istediğim id olmayan siparişleri tut.
                    renderOrders(); //sipariş dizisi değişti güncel sipariş listesini tekrar ekrana bas.
                }
            });

            orderForm.addEventListener("submit", (e) => { //form gönderme olayını dinle
                //sipariş formu önderilirse haber ver.
                e.preventDefault(); //formu klasik şekilde gönderip sayfayu YENİLEME

                const name = document.getElementById("prodName").value;
                const category = document.getElementById("prodCat").value;
                const price = Number(document.getElementById("prodPrice").value);
                //yeni sipariş bilgilerini al

                const newOrder = {
                    id: Date.now(), //o anki zamanı milisaniye cinsinden sayı olrk verir.
                    name: name,
                    category: category,
                    price: price
                }; //yeni sipariş nesnesi olştr.

                orders.push(newOrder); //dizinin sonuna yeni elemean ekler.

                orderForm.reset(); //formu sıfırlar

                renderOrders(); //yeni listeyi yeniden yazdırır.
            });
            searchInput.addEventListener("input", renderOrders); //kullanıcı yazdığı anda listeyi filtrele
            categoryFilter.addEventListener("change", renderOrders); //kategori değişince listeyi filtreler.
            renderOrders(); //listeyi yeniden yazdır.
        </script>
    </div>
</body>

</html>
